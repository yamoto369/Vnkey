# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit AI review for yamoto369/Vnkey (Windows-only Vikey project).
# It reviews pull requests statically; nothing here runs contributor code.
language: "en-US"
reviews:
  profile: "chill"
  request_changes_workflow: true    # Tony 2026-10-31: CodeRabbit requests changes on real issues and approves once they are resolved
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["main"]
  path_instructions:
    - path: "Engine/**"
      instructions: >-
        Shared typing engine used by the Windows app and validation tools. Check buffer bounds
        (MAX_BUFF, TypingWord, KeyStates), state reset between words, and that behaviour changes come with a case in
        Tools/autoswitch/rules/rules.tsv and, for a new rule, an entry in DECISIONS.md.
    - path: "Windows/**"
      instructions: "Windows port (Win32 low-level keyboard hook, SendInput, UI Automation). The hook must stay fast and never swallow key-ups; password fields must pass keys through untouched."
    - path: ".github/**"
      instructions: "Security-sensitive: CI workflows. Flag any change to triggers (pull_request_target), permissions, secrets use, or new third-party actions."
    - path: "Tools/release/**"
      instructions: "Security-sensitive: Windows code signing, release assets and site deploy. Flag anything that changes signing keys, download URLs or verification."
chat:
  auto_reply: true
